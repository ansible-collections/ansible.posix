---
# Test that ansible_host set via play-level vars: (present in task_vars but
# absent from the hostvars snapshot for the target host) is correctly used
# to build the rsync destination instead of falling back to inventory_hostname.
# Regression test for https://github.com/ansible-collections/ansible.posix/issues/469
fixtures:
  taskvars_in: taskvars_in.json
  taskvars_out: taskvars_out.json
connection:
  transport: ssh
hostvars:
  127.0.0.1: {}
  ::1: {}
  localhost: {}
asserts:
  - hasattr(SAM._connection, 'ismock')
  - self.execute_called
  - self.final_module_args['_local_rsync_path'] == 'rsync'
  - self.final_module_args['src'] == '/tmp/deleteme'
  - self.final_module_args['dest'] == 'root@el6host.example.org:/tmp/deleteme'
