---
- name: Test the decrypt option of synchronize without a vault secret
  hosts: testhost
  gather_facts: false
  tasks:
    - name: Synchronize an encrypted file using decrypt without a vault secret
      ansible.posix.synchronize:
        src: source/secret.txt
        dest: "{{ output_dir }}/no_secret.result"
        decrypt: true
      register: sync_result
      ignore_errors: true
      delegate_to: "{{ inventory_hostname }}"

    - name: Test that the file was really not copied over
      ansible.builtin.stat:
        path: "{{ output_dir }}/no_secret.result"
      register: stat_result

    - name: Ensure no change occurred and failed
      ansible.builtin.assert:
        that:
          - sync_result is not changed
          - sync_result is failed
          - "'Failed to decrypt' in sync_result.msg"
          - stat_result.stat.exists == False
