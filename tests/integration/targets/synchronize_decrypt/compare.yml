---
- name: List the files in {{ left }} and {{ right }}
  ansible.builtin.include_tasks: list.yml
  loop_control:
    loop_var: list
  loop:
    - name: list_left
      path: "{{ left }}"
    - name: list_right
      path: "{{ right }}"

- name: Ensure both directories have the same content, permissions and modification times
  ansible.builtin.assert:
    that:
      - list_left | length > 0
      - list_left == list_right
