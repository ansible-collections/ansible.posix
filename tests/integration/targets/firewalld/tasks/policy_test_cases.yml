---
# Policy object tests require firewalld >= 0.9.0 (already a module requirement)

- name: Firewalld create policy ansible_test_policy
  ansible.posix.firewalld:
    policy: ansible_test_policy
    permanent: true
    state: present
  register: result

- name: Assert firewalld policy created
  ansible.builtin.assert:
    that:
      - result is changed

- name: Firewalld create policy ansible_test_policy rerun (verify not changed)
  ansible.posix.firewalld:
    policy: ansible_test_policy
    permanent: true
    state: present
  register: result

- name: Assert firewalld policy create is idempotent
  ansible.builtin.assert:
    that:
      - result is not changed

- name: Add ingress zone to policy
  ansible.posix.firewalld:
    policy: ansible_test_policy
    ingress_zone: public
    permanent: true
    state: enabled
  register: result

- name: Assert ingress zone added
  ansible.builtin.assert:
    that:
      - result is changed

- name: Add ingress zone to policy rerun (verify not changed)
  ansible.posix.firewalld:
    policy: ansible_test_policy
    ingress_zone: public
    permanent: true
    state: enabled
  register: result

- name: Assert ingress zone add is idempotent
  ansible.builtin.assert:
    that:
      - result is not changed

- name: Add egress zone to policy
  ansible.posix.firewalld:
    policy: ansible_test_policy
    egress_zone: trusted
    permanent: true
    state: enabled
  register: result

- name: Assert egress zone added
  ansible.builtin.assert:
    that:
      - result is changed

- name: Add egress zone to policy rerun (verify not changed)
  ansible.posix.firewalld:
    policy: ansible_test_policy
    egress_zone: trusted
    permanent: true
    state: enabled
  register: result

- name: Assert egress zone add is idempotent
  ansible.builtin.assert:
    that:
      - result is not changed

- name: Remove ingress zone from policy
  ansible.posix.firewalld:
    policy: ansible_test_policy
    ingress_zone: public
    permanent: true
    state: disabled
  register: result

- name: Assert ingress zone removed
  ansible.builtin.assert:
    that:
      - result is changed

- name: Remove egress zone from policy
  ansible.posix.firewalld:
    policy: ansible_test_policy
    egress_zone: trusted
    permanent: true
    state: disabled
  register: result

- name: Assert egress zone removed
  ansible.builtin.assert:
    that:
      - result is changed

- name: Firewalld remove policy ansible_test_policy
  ansible.posix.firewalld:
    policy: ansible_test_policy
    permanent: true
    state: absent
  register: result

- name: Assert firewalld policy removed
  ansible.builtin.assert:
    that:
      - result is changed

- name: Firewalld remove policy ansible_test_policy rerun (verify not changed)
  ansible.posix.firewalld:
    policy: ansible_test_policy
    permanent: true
    state: absent
  register: result

- name: Assert firewalld policy remove is idempotent
  ansible.builtin.assert:
    that:
      - result is not changed
